_subdirectory: template
# Keep the .agents/skills and .claude/skills entries as symlinks to the feature
# folders instead of dereferencing them into copies.
_preserve_symlinks: true
_envops:
  trim_blocks: true
  lstrip_blocks: true
  keep_trailing_newline: true
_exclude:
  - 'copier.yml'
  - '**/__pycache__'
  - '**/*.pyc'
  - '.venv'
  # Raw license texts are pulled in via {% include %} by the LICENSE file;
  # they must not be copied into the rendered project themselves.
  - 'licenses'

project_name:
  type: str
  help: Human-readable project name
  default: My Project

project_slug:
  type: str
  help: Python-safe slug (used in pyproject.toml, Docker image names, etc.)
  default: "{{ project_name.lower().replace(' ', '-').replace('_', '-') }}"

initial_app_name:
  type: str
  help: Name of the first Django app to scaffold
  default: core

author_name:
  type: str
  help: Your name (used in pyproject.toml authors)
  default: ''

author_email:
  type: str
  help: Your email (used in pyproject.toml authors)
  default: ''

python_version:
  type: str
  help: Python version to target
  default: '3.14'
  choices:
    - '3.14'

use_redis:
  type: bool
  help: >-
    Include Redis + django-tasks-rq for background tasks?
    (No = synchronous ImmediateBackend, no extra infra needed)
  default: true

use_async:
  type: bool
  help: Serve via ASGI/uvicorn instead of WSGI/gunicorn?
  default: false

use_shinobi:
  type: bool
  help: >-
    Include a django-shinobi (Django Ninja) API layer with JWT auth and an
    example health/token/me API? (No = no API layer, admin site only)
  default: true

open_source_license:
  type: str
  help: License for the project
  default: 'MIT'
  choices:
    'MIT': 'MIT'
    'BSD 3-Clause': 'BSD-3-Clause'
    'Apache License 2.0': 'Apache-2.0'
    'GNU GPL v3': 'GNU GPLv3'
    'GNU AGPL v3': 'GNU AGPLv3'
    'Proprietary (all rights reserved)': 'Proprietary'
    'None': 'None'

copyright_holder:
  type: str
  help: Name to appear in the copyright notice
  default: '{{ author_name if author_name else project_name }}'
  when: "{{ open_source_license not in ['None', 'Apache-2.0', 'GNU GPLv3', 'GNU AGPLv3'] }}"

copyright_year:
  type: str
  help: Year to appear in the copyright notice
  default: '2026'
  when: "{{ open_source_license not in ['None', 'Apache-2.0', 'GNU GPLv3', 'GNU AGPLv3'] }}"
